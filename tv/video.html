<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Changing Places 4K In-Store Screensaver Video</title>
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
    <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet" />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" href="../images/favicon/favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="video.css?v=1" />
  </head>
  <body>
    <video
      aria-label="Changing Places in-store screensaver"
      width="3840"
      height="2160"
      controls
      loop
      muted
      playsinline
      preload="auto"
    >
      <source
        src="media/screensaver-4k-avc.mp4"
        type='video/mp4; codecs="avc1.640034"'
      />
      <source
        src="media/screensaver-4k-hevc.mp4"
        type='video/mp4; codecs="hvc1"'
      />
      This browser does not support the screensaver video.
    </video>
  </body>
</html>
