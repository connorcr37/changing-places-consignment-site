<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <meta name="referrer" content="no-referrer" />
  <title>Text the Consignor | Changing Places</title>
  <link rel="icon" href="/images/favicon/favicon.ico" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/text-consignor.css" />
  <script src="/text-consignor.js" type="module"></script>
</head>
<body>
  <main class="text-card">
    <img src="/images/logo.jpg" width="64" height="64" alt="Changing Places Consignment Shop" />
    <h1>Text the consignor</h1>
    <div id="text-contact" hidden>
      <p>Start a new message to</p>
      <p id="text-number" class="text-number"></p>
      <a id="open-message" class="text-action">Open text message</a>
      <p class="text-help">If your messaging app doesn’t open, use the number above.</p>
    </div>
    <p id="text-error">This link is incomplete. Please use the phone number in your submission email.</p>
    <noscript><p>Please enable JavaScript to open a text message, or use the number in your submission email.</p></noscript>
  </main>
</body>
</html>
