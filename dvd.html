<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Changing Places DVD Screensaver</title>
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
    <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet" />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" href="images/favicon/favicon.ico" type="image/x-icon" />
    <link rel="preload" href="images/logo.jpg" as="image" />
    <link rel="stylesheet" href="dvd.css?v=1" />
    <script src="dvd.js?v=1" defer></script>
  </head>
  <body>
    <main class="dvd-screen" id="dvd-screen">
      <img
        class="dvd-logo"
        id="dvd-logo"
        src="images/logo.jpg"
        alt="Changing Places Consignment Shop logo"
        width="200"
        height="200"
        decoding="sync"
        draggable="false"
      />
    </main>
  </body>
</html>
